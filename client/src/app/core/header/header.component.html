<header id="header-sticky" class="header-1">
    <div class="container-fluid">
        <div class="mega-menu-wrapper">
            <div class="header-main">
                <div class="logo">
                    <a routerLink="/home" class="header-logo">
                        <img src="/logo.svg" alt="logo-img">
                    </a>
                </div>
                <div class="mean__menu-wrapper">
                    <div class="main-menu">
                        <nav style="display: block;">
                            <ul>
                                <li>
                                    <a routerLink="/home">
                                        Home
                                    </a>
                                </li>
                                <li>
                                    <a routerLink="/books-catalog">
                                        Books
                                    </a>
                                </li>
                                @if(!isLoggedIn){
                                    <!--Is not logged in-->
                                    <li>
                                        <a routerLink="/login">
                                            Login
                                        </a>
                                    </li>
                                    <li>
                                        <a routerLink="/register">
                                            Register
                                        </a>
                                    </li>
                                } @else {
                                    <!--Is logged in-->
                                    <li>
                                        <a routerLink="/add-book">
                                            Add Book
                                        </a>
                                    </li>
                                    <li class="has-dropdown">
                                        <a routerLink="/profile">
                                            Profile
                                            <i class="fas fa-angle-down"></i>
                                        </a>
                                        <ul class="submenu">
                                            <li><a routerLink="/profile">My Profile</a></li>
                                            <li><a routerLink="/profile/my-books">My Books</a></li>
                                           <!-- TODO <li><a routerLink="/profile/my-favourite">My Favourite</a></li> -->
                                            <li><a routerLink="/profile/my-reviews">My Reviews</a></li>
                                            <li><a (click)="logout()">Logout</a></li>
                                        </ul>
                                    </li>
                                }
                            </ul>
                        </nav>
                    </div>
                </div>
                <div class="header-right d-flex justify-content-end align-items-center">
                </div>
            </div>
        </div>
    </div>
</header>

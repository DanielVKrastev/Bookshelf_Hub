<!-- Top Ratting Book Section start  -->
<section class="top-ratting-book-section fix section-padding bg-cover"
    style="background-image: url(assets/img/ratting-bg.jpg);">
    <div class="container">
        <div class="top-ratting-book-wrapper">
            <div class="section-title-area">
                <div class="section-title">
                    <h2 class="wow fadeInUp" data-wow-delay=".3s">Top Rating Books</h2>
                </div>
                <a routerLink="/books-catalog" class="theme-btn wow fadeInUp" data-wow-delay=".5s">
                    view more books
                    <i class="fa-solid fa-arrow-right-long"></i>
                </a>
            </div>
            <div class="row">
                @for (book of books; track $index) {
                <div class="col-xl-6 wow fadeInUp" data-wow-delay=".3s">
                    <div class="top-ratting-box-items">
                        <div class="book-thumb">
                            <a [routerLink]="'/books-catalog/'+book._id">
                                <img src="assets/img/top-book/01.png" alt="img">
                            </a>
                        </div>
                        <div class="book-content">
                            <div class="title-header">
                                <div>
                                    <h5> {{book.author}} </h5>
                                    <h3>
                                        <a [routerLink]="'/books-catalog/'+book._id">{{book.title}}</a>
                                    </h3>
                                    <h5>
                                        Publisher: {{book.publisher}}
                                    </h5>
                                </div>
                                <ul class="shop-icon d-flex justify-content-center align-items-center">
                                    <li>
                                        <a [routerLink]="'/books-catalog/'+book._id"><i class="far fa-heart"></i></a>
                                    </li>
                                    <li>
                                        <a [routerLink]="'/books-catalog/'+book._id"><i class="far fa-eye"></i></a>
                                    </li>
                                </ul>
                            </div>
                            <span class="mt-10">{{book.created_at | elapsedTime}}</span>
                            <ul class="author-post">
                                <li class="authot-list">
                                    <span class="thumb">
                                        <img class="profile-img" [src]="book.owner.imageUrl || `assets/img/testimonial/client-2.png`" alt="img">
                                    </span>
                                    <span class="profile-username content mt-10">{{book.owner.username}}</span>
                                </li>
                            </ul>
                            <div class="shop-btn">
                                <div class="star">
                                    @for (star of getStars(book.averageRating); track $index) {
                                        <i
                                            class="fa-star"
                                            [class.fa-solid]="star"
                                            [class.fa-regular]="!star">
                                        </i>
                                    }
                                </div>
                                <a [routerLink]="'/books-catalog/'+book._id" class="theme-btn">View</a>
                            </div>
                        </div>
                    </div>
                </div>
                }

            </div>
        </div>
    </div>
</section>

<div class="register-section" style="background-image:url(assets/img/hero/breadcrumb-bg.jpg);">

    <div class="register-container">

        <div class="register-header">
            <h2>Create Account</h2>
            <p>Register to access your account</p>
        </div>

        <form class="register-form" #form="ngForm" (ngSubmit)="register(form)">

            <div class="register-field">
                <label>Username *</label>
                <input 
                    type="text" 
                    name="username"
                    id="username"
                    placeholder="User"
                    ngModel
                    #inputUsername="ngModel"
                    required
                >
            </div>

            <div class="register-field">
                <label>Email Address *</label>
                <input 
                    type="email" 
                    name="email"
                    id="email"
                    placeholder="danielk@gmail.com"
                    ngModel
                    #inputEmail="ngModel"
                    required
                >
            </div>

            <div class="register-field">
                <label>Password *</label>
                <input 
                    type="password" 
                    name="password"
                    id="password" 
                    placeholder="******"
                    #inputPassword="ngModel" 
                    ngModel 
                    minlength="5"
                    required
                >
            </div>

            <div class="register-field">
                <label>Confirm Password *</label>
                <input 
                    type="password" 
                    name="rePassword"
                    id="rePassword" 
                    placeholder="******"
                    #inputrePassword="ngModel" 
                    ngModel 
                    minlength="5"
                    required
                >
            </div>

            <button class="register-btn" type="submit">
                Create Account
            </button>

        </form>

        <div class="register-footer">
            <p>Already have an account?</p>
            <a routerLink="/login">Log In</a>
        </div>

    </div>

</div>

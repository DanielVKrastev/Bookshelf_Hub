<div class="login-page" style="background-image: url(assets/img/hero/breadcrumb-bg.jpg);">
    <div class="login-box">

        <div class="cart-title mb-30">
            <h4>Log in</h4>
        </div>

        <form #form="ngForm" (ngSubmit)="login(form)">

            <div class="form-clt">
                <span>Email address *</span>
                <input 
                    type="email" 
                    name="email"
                    id="email"
                    placeholder="danielk@gmail.com"
                    ngModel
                    #inputEmail="ngModel"
                    required
                >
            </div>

            @if(inputEmail?.touched){
                <div>
                @if(inputEmail?.errors?.['required']){
                    <p class="error">
                        Email is required!
                    </p>
                }

                 @if(inputEmail?.errors?.['emailValidator']){
                    <p class="error">
                        Email is not valid!
                    </p>
                }
                </div>
            }

            <div class="form-clt">
                <span>Password *</span>
                <input 
                    type="password" 
                    name="password"
                    id="password" 
                    placeholder="******"
                    #inputPassword="ngModel" 
                    ngModel 
                    minlength="5"
                    required
                >
            </div>

            <button class="theme-btn" type="submit">
                <span>Log In</span>
            </button>

            <div class="remember-me">
                <label>
                    <input type="checkbox"> Remember Me
                </label>
            </div>

        </form>

        <div class="no-account-yet">
            <p>No account yet?</p>
            <a routerLink="/register">Create an Account</a>
        </div>

    </div>
</div>

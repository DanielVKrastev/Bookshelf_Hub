<app-breadcrumb pageName="Profile" pageNameUrl="/profile" pageName2="My Books" />
<!--My Books Section Start -->
<div class="cart-section section-padding pb-0">
    <div class="container">
        <div class="main-cart-wrapper">
            <div class="row">
                <div class="col-12">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Book</th>
                                    <th>Author</th>
                                    <th>Total Page</th>
                                    <th>Rating</th>
                                    <th>Reviews</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            @if (isLoading) {
                            <tr>
                                <td colspan="6">Loading...</td>
                            </tr>
                            } @else {
                            <tbody>
                                @for (book of books; track $index) {
                                @if (editingBookId === book._id) {
                                <tr>
                                    <td colspan="5">
                                        <!-- EDIT MODE -->
                                        <div class="edit-form">
                                            <div class="form-grid">

                                                <div class="form-group">
                                                    <label>Title</label>
                                                    <input [(ngModel)]="editForm.title" />
                                                </div>

                                                <div class="form-group">
                                                    <label>Author</label>
                                                    <input [(ngModel)]="editForm.author" />
                                                </div>

                                                <div class="form-group">
                                                    <label>Publisher</label>
                                                    <input [(ngModel)]="editForm.publisher" />
                                                </div>

                                                <div class="form-group">
                                                    <label>Publish Year</label>
                                                    <input [(ngModel)]="editForm.publishYear" />
                                                </div>

                                                <div class="form-group">
                                                    <label>Language</label>
                                                    <input [(ngModel)]="editForm.language" />
                                                </div>

                                                <div class="form-group">
                                                    <label>Total Pages</label>
                                                    <input [(ngModel)]="editForm.totalPage" />
                                                </div>

                                                <div class="form-group">
                                                    <label>Country</label>
                                                    <input [(ngModel)]="editForm.country" />
                                                </div>

                                                <div class="form-group full-width">
                                                    <label>Image URL</label>
                                                    <input [(ngModel)]="editForm.imageUrl" />
                                                </div>

                                                <div class="form-group full-width">
                                                    <label>Description</label>
                                                    <textarea [(ngModel)]="editForm.description"></textarea>
                                                </div>
                                                <input [(ngModel)]="editForm.category" hidden />
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="action-buttons">
                                            <button class="btn-edit" (click)="saveEdit(book._id)">Save</button>
                                            <button class="btn-delete" (click)="cancelEdit()">Cancel</button>
                                        </div>
                                    </td>
                                </tr>

                                } @else {
                                <tr>
                                    <td>
                                        <!-- VIEW MODE -->
                                        <a [routerLink]="`/books-catalog/${book._id}`">
                                            <span class="d-flex gap-5 align-items-center">
                                                {{$index}}
                                                <span class="cart">
                                                    <img [src]="book.imageUrl" alt="img">
                                                </span>
                                                <span class="cart-title">
                                                    {{book.title}}
                                                </span>
                                            </span>
                                        </a>


                                    </td>

                                    <td>
                                        <span>{{book.author}}</span>
                                    </td>

                                    <td>
                                        <span>{{book.totalPage}}</span>
                                    </td>

                                    <td>
                                        <span>{{book.averageRating}}</span>
                                    </td>

                                    <td>
                                        <span>{{book.reviews?.length}}</span>
                                    </td>

                                    <td>
                                        <div class="action-buttons">
                                            <button class="btn-edit" (click)="startEdit(book)">Edit</button>
                                            <button class="btn-delete" (click)="deleteBook(book._id)">Delete</button>
                                        </div>
                                    </td>
                                </tr>
                                }
                                }

                            </tbody>
                            }
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

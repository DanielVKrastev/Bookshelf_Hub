<app-breadcrumb pageName="Add Book"/>
<!-- Add book-->
<form class="book-add-form two-columns" #form="ngForm" (ngSubmit)="addBook(form)">

    <!-- Basic Information -->
    <div class="book-group">
        <h3>Basic Information</h3>

        <div class="book-fields">

            <div class="book-field">
                <label>Title *</label>
                <input type="text" name="title" id="title" #inputTitle="ngModel" ngModel required>
            </div>

            <div class="book-field">
                <label>Author *</label>
                <input type="text" name="author" id="author" #inputAuthor="ngModel" ngModel required>
            </div>

            <div class="book-field">
                <label>Category *</label>

                <select name="category" id="category" #inputCategory="ngModel" ngModel required>
                    <option value="">Select category</option>
                    <option value="fiction">Fiction</option>
                    <option value="non-fiction">Non-Fiction</option>
                    <option value="fantasy">Fantasy</option>
                    <option value="science-fiction">Science Fiction</option>
                    <option value="mystery">Mystery / Thriller</option>
                    <option value="romance">Romance</option>
                    <option value="horror">Horror</option>
                    <option value="historical">Historical</option>
                    <option value="biography">Biography</option>
                    <option value="self-help">Self-Help</option>
                    <option value="business">Business</option>
                    <option value="science">Science</option>
                    <option value="technology">Technology</option>
                    <option value="children">Children's Books</option>
                    <option value="young-adult">Young Adult</option>
                    <option value="comics">Comics / Graphic Novels</option>
                    <option value="poetry">Poetry</option>
                </select>
            </div>

            <div class="book-field">
                <label>Language *</label>
                <input type="text" name="language" name="language" id="language" #inputLanguage="ngModel" ngModel required>
            </div>

            <div class="book-field full">
                <label>Description</label>
                <textarea name="description" name="description" id="description" rows="8" #inputDescription="ngModel" ngModel required minlength="10"></textarea>
            </div>

        </div>
    </div>

    <!-- Publication -->
    <div class="book-group">
        <h3>Publication Information</h3>

        <div class="book-fields">

            <div class="book-field">
                <label>Publisher *</label>
                <input type="text" name="publisher" id="publisher" #inputPublisher="ngModel" ngModel required>
            </div>

            <div class="book-field">
                <label>Publication Year *</label>
                <input type="number" name="publishYear" id="publishYear" #inputPublishYear="ngModel" ngModel required>
            </div>

            <div class="book-field">
                <label>Pages *</label>
                <input type="number" name="totalPage" id="totalPage" #inputTotalPage="ngModel" ngModel required>
            </div>

            <div class="book-field">
                <label>Country *</label>
                <input type="text" name="country" id="country" #inputCountry="ngModel" ngModel required >
            </div>

        </div>
    </div>

    <!-- Cover -->
    <div class="book-group">
        <h3>Book Cover</h3>

        <div class="book-field">
            <label>Cover Image (URL)</label>
            <input type="text" name="imageUrl" id="imageUrl" #inputImageUrl="ngModel" ngModel required >
        </div>
    </div>

    <button class="book-submit-btn theme-btn">Add Book</button>

</form>

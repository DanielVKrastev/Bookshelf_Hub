<div class="tab-content" id="pills-tabContent">
    <div class="tab-pane fade show active" id="pills-arts" role="tabpanel" aria-labelledby="pills-arts-tab"
        tabindex="0">
        <div class="row">
            <!-- Book cart component -->
            @for (book of books; track $index) {
            <div class="col-xl-3 col-lg-4 col-md-6 wow fadeInUp" data-wow-delay=".4s">
                <div class="shop-box-items">
                    <div class="book-thumb center">
                        <a [routerLink]="book._id"><img [src]="book.imageUrl || 'assets/img/book/02.png'"
                                alt="img"></a>
                        <ul class="shop-icon d-grid justify-content-center align-items-center">
                            <!-- Query for favourite -->
                            <li>
                                <a [routerLink]="book._id"><i class="far fa-heart"></i></a>
                            </li>
                            <li>
                                <a [routerLink]="book._id"><i class="far fa-eye"></i></a>
                            </li>
                        </ul>
                    </div>
                    <div class="shop-content">
                        <h3><a [routerLink]="book._id">{{book.title}}</a></h3>
                        <h6>{{book.author}}</h6>
                        <ul class="price-list">
                            <li>
                                1 day ago
                            </li>

                            <li>
                                <i class="fa-solid fa-star"></i>
                                {{book.averageRating}} ({{book.reviewsCount}})
                            </li>
                        </ul>
                        <div class="shop-button">
                            <a [routerLink]="book._id" class="theme-btn">View</a>
                        </div>
                    </div>
                </div>
            </div>
            }
            <div class="col-xl-3 col-lg-4 col-md-6 wow fadeInUp" data-wow-delay=".2s">
                <div class="shop-box-items">
                    <div class="book-thumb center">
                        <a routerLink="/books-catalog/1"><img src="assets/img/book/01.png" alt="img"></a>
                        <ul class="post-box">
                            <li>
                                New
                            </li>
                        </ul>
                        <ul class="shop-icon d-grid justify-content-center align-items-center">
                            <li>
                                <a routerLink="/books-catalog/1"><i class="far fa-heart"></i></a>
                            </li>
                            <li>
                                <a routerLink="/books-catalog/1"><i class="far fa-eye"></i></a>
                            </li>
                        </ul>
                    </div>
                    <div class="shop-content">
                        <h3><a routerLink="/books-catalog/1">Simple Things You Save BOOK</a></h3>
                        <h6>Author Name</h6>
                        <ul class="price-list">
                            <li>
                                1 day ago
                            </li>

                            <li>
                                <i class="fa-solid fa-star"></i>
                                3.4 (25)
                            </li>
                        </ul>
                        <div class="shop-button">
                            <a routerLink="/books-catalog/1" class="theme-btn">View</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
